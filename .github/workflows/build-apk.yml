name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME: $JAVA_HOME"
          java -version

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {split($2, v, "."); if (v[1] == "1") print v[2]; else print v[1]; exit}')

          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required."
            exit 1
          fi

          echo "Java environment verified successfully."

      # --------------------------------------------------
      # 3. Set up Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle
        run: |
          gradle --version

      # --------------------------------------------------
      # 4. Accept Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found at $SDKMANAGER"
            find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

      # --------------------------------------------------
      # 5. Generate temporary debug keystore
      # --------------------------------------------------
      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -e

          if [ -f "./debug.keystore" ]; then
            echo "Existing debug keystore found."
          else
            echo "Generating temporary debug keystore..."

            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "::error::Debug keystore creation failed."
            exit 1
          fi

          echo "Debug keystore verified."

      # --------------------------------------------------
      # 6. Build debug APK and preserve the complete log
      # --------------------------------------------------
      - name: Build debug APK
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          echo "Starting Gradle build..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_EXIT"
          fi

          exit "$BUILD_EXIT"

      # --------------------------------------------------
      # 7. Extract Kotlin errors and Gradle failure details
      # --------------------------------------------------
      - name: Show build errors
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Build Failed"
            echo ""
            echo "Gradle exit code: ${{ steps.build.outputs.exit_code }}"
            echo ""

            echo "### Kotlin compiler errors"
            echo ""

            echo '```text'

            if [ -f build.log ]; then
              grep -n -i -E \
                '(^e: |^error:|\.kt:[0-9]+:[0-9]+: error:|Unresolved reference|Type mismatch|Overload resolution ambiguity|Cannot access class|incompatible version of Kotlin|Compilation error|Could not resolve|Could not find|No matching variant)' \
                build.log | head -100 || true

              echo '```'
              echo ""

              echo "### Gradle failure details"
              echo ""
              echo '```text'

              if grep -q 'What went wrong:' build.log; then
                sed -n '/What went wrong:/,/^\* Try:/p' build.log | head -100
              else
                echo "No standard Gradle failure section was found."
              fi

              echo '```'
              echo ""

              echo "### Last 150 lines of build log"
              echo ""
              echo '```text'
              tail -150 build.log
              echo '```'
            else
              echo "Build log was not generated."
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # 8. Upload complete build log on success or failure
      # --------------------------------------------------
      - name: Upload build log
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------
      # 9. Stop if compilation failed
      # --------------------------------------------------
      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::APK generation failed. See the Build Summary and build-log artifact."
          exit 1

      # --------------------------------------------------
      # 10. Verify generated APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::APK not found at $EXPECTED_APK"

            echo "Available APK files:"
            find app -type f -name "*.apk" -print 2>/dev/null || true

            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file is empty."
            exit 1
          fi

          if ! file "$EXPECTED_APK" | grep -q 'Zip archive'; then
            echo "::error::Generated APK is not a valid ZIP-based Android package."
            exit 1
          fi

          echo "APK verified successfully."
          ls -lh "$EXPECTED_APK"

          # --------------------------------------------------
      # 11. Upload APK as a workflow artifact
      # --------------------------------------------------
      - name: Upload debug APK artifact
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # --------------------------------------------------
      # 12. Prepare APK release asset
      # --------------------------------------------------
      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e

          REPO_NAME_ONLY="${REPOSITORY##*/}"

          SAFE_REPO_NAME=$(echo "$REPO_NAME_ONLY" |
            tr -cs 'a-zA-Z0-9._-' '-' |
            sed 's/^-//;s/-$//')

          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="app"
          fi

          RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$RELEASE_DIR"

          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          RELEASE_FILE_PATH="${RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_FILE_PATH"

          if [ ! -s "$RELEASE_FILE_PATH" ]; then
            echo "::error::Failed to prepare release APK."
            exit 1
          fi

          echo "asset_path=$RELEASE_FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

          echo "Release asset prepared: $RELEASE_FILENAME"

      # --------------------------------------------------
      # 13. Publish APK to GitHub Releases
      # --------------------------------------------------
      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          gh --version

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Debug APK Build #${RUN_NUMBER}

          - **Build Type:** Debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${RUN_NUMBER}
          - **Run Attempt:** ${RUN_ATTEMPT}
          - **Commit SHA:** ${COMMIT_SHA}
          - **Signing:** Temporary debug keystore
          - **Purpose:** Testing and development only

          Download the APK from the Assets section below.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$COMMIT_SHA"

          RELEASE_URL=$(gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json url \
            --jq '.url')

          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Release published: $RELEASE_URL"

      # --------------------------------------------------
      # 14. Report final result
      # --------------------------------------------------
      - name: Report APK download result
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_URL: ${{ steps.publish_release.outputs.release_url }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          {
            echo "## Debug APK Build Result"
            echo ""

            if [ "$BUILD_OUTCOME" != "success" ]; then
              echo "### Build failed"
              echo ""
              echo "Review the Kotlin compiler errors above and download the build-log artifact."
            elif [ "$RELEASE_OUTCOME" = "success" ]; then
              echo "### APK built and released successfully"
              echo ""
              echo "**Release:** $RELEASE_TAG"
              echo ""
              echo "**APK filename:** $ASSET_NAME"
              echo ""
              echo "**Download:** $RELEASE_URL"
              echo ""
              echo "The app-debug-apk workflow artifact is also available as a backup."
            else
              echo "### APK built successfully, but release publishing failed"
              echo ""
              echo "Download the app-debug-apk artifact from this workflow run."
              echo ""
              echo "Check repository release permissions if publishing continues to fail."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
